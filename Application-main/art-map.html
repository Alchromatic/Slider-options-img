<!DOCTYPE html>
<html lang="en" class="dark">

<head>
   <meta charset="UTF-8">
   <meta name="viewport" content="width=device-width, initial-scale=1.0">
   <title>Art Map | GeoMagic</title>

   <link rel="shortcut icon" type="image/x-icon" href="assets/img/favicon/favicon.ico">
   <link rel="preconnect" href="https://fonts.googleapis.com">
   <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
   <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300..800&display=swap" rel="stylesheet">
   <link rel="stylesheet" href="assets/fontawesome/fontawesome.min.css">

   <script src="https://cdn.tailwindcss.com"></script>
   <script>
      tailwind.config = { darkMode: 'class', theme: { extend: { fontFamily: { sans: ['Inter', 'sans-serif'] } } } };
   </script>
   <style>
      body { font-family: 'Inter', sans-serif; overscroll-behavior: none; }
      #map { cursor: grab; touch-action: none; }
      #map.dragging { cursor: grabbing; }
      #tooltip { pointer-events: none; transition: opacity .12s ease; }
   </style>
</head>

<body class="bg-neutral-950 text-neutral-200 h-screen overflow-hidden flex flex-col">

   <!-- Header -->
   <header class="flex flex-wrap items-center justify-between gap-3 px-4 sm:px-6 py-3 border-b border-neutral-900 z-30 bg-neutral-950">
      <div class="flex items-center gap-4">
         <a href="image-gallery.html" class="text-xs text-neutral-500 hover:text-neutral-300">
            <i class="fa-solid fa-arrow-left mr-1"></i> Gallery
         </a>
         <h1 class="text-lg font-bold text-white flex items-center gap-2">
            <i class="fa-solid fa-map text-blue-500"></i> Art Map
         </h1>
         <p id="subtitle" class="hidden sm:block text-xs text-neutral-500">
            Visually similar artworks sit close together — drag to pan, scroll to zoom.
         </p>
      </div>
      <div class="flex items-center gap-2">
         <div id="modes" class="flex items-center bg-neutral-900 border border-neutral-800 rounded-lg p-0.5">
            <button data-mode="sim" class="text-[11px] px-2.5 py-1.5 rounded-md bg-neutral-700 text-white">Similarity</button>
            <button data-mode="time" class="text-[11px] px-2.5 py-1.5 rounded-md text-neutral-400 hover:text-white">Timeline</button>
            <button data-mode="origin" class="text-[11px] px-2.5 py-1.5 rounded-md text-neutral-400 hover:text-white">Origin</button>
            <button data-mode="theme" class="text-[11px] px-2.5 py-1.5 rounded-md text-neutral-400 hover:text-white">Theme</button>
         </div>
         <div id="hotspots" class="flex items-center gap-1.5 flex-wrap"></div>
         <button id="resetView" title="Reset view"
            class="text-xs bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 rounded-lg px-3 py-1.5">
            <i class="fa-solid fa-compress mr-1"></i> Fit
         </button>
      </div>
   </header>

   <!-- Map -->
   <div class="relative flex-1">
      <canvas id="map" class="absolute inset-0 w-full h-full"></canvas>
      <div id="tooltip"
         class="absolute z-20 hidden max-w-[260px] bg-neutral-900/95 border border-neutral-800 rounded-lg px-3 py-2 shadow-xl opacity-0">
         <p id="ttTitle" class="text-xs font-semibold text-white leading-tight"></p>
         <p id="ttMeta" class="text-[11px] text-neutral-400 mt-0.5"></p>
      </div>
      <div id="empty" class="absolute inset-0 hidden items-center justify-center">
         <div class="text-center max-w-sm px-6">
            <i class="fa-solid fa-map text-3xl text-neutral-700"></i>
            <p class="text-sm text-neutral-400 mt-3">The similarity map hasn't been built yet.</p>
            <p class="text-xs text-neutral-600 mt-1">An administrator can build it from the Library admin page
               ("Build similarity map").</p>
         </div>
      </div>
      <p id="loadNote" class="absolute bottom-3 left-4 text-[11px] text-neutral-600 z-10"></p>
   </div>

   <!-- Lightbox (same behaviour as the gallery) -->
   <div id="lightbox" class="fixed inset-0 z-50 hidden items-center justify-center bg-black/85 backdrop-blur-sm p-4">
      <button id="lbClose" class="absolute top-5 right-6 text-white/80 hover:text-white text-3xl">&times;</button>
      <div class="max-w-5xl w-full max-h-full flex flex-col items-center">
         <img id="lbImg" class="max-h-[72vh] max-w-full rounded-lg shadow-2xl object-contain" alt="">
         <div class="mt-4 text-center max-w-2xl">
            <h3 id="lbTitle" class="text-lg font-semibold text-white"></h3>
            <p id="lbMeta" class="text-sm text-neutral-400 mt-1"></p>
            <a id="lbSource" target="_blank" rel="noopener"
               class="inline-block mt-3 text-sm text-blue-400 hover:text-blue-300">
               View at source <i class="fa-solid fa-arrow-up-right-from-square ml-1 text-xs"></i>
            </a>
         </div>
      </div>
      <button id="lbUse"
         class="absolute bottom-6 right-6 inline-flex items-center gap-2 bg-blue-600 hover:bg-blue-500 text-white font-semibold text-sm px-5 py-3 rounded-xl shadow-lg disabled:opacity-50">
         <i class="fa-solid fa-wand-magic-sparkles"></i> Use this image
      </button>
   </div>

   <script>
      const API_BASE =
         (new URLSearchParams(location.search).get('api') || '').replace(/\/$/, '') ||
         location.origin;
      const $ = (id) => document.getElementById(id);
      const esc = (s) => String(s || '').replace(/[&<>"]/g,
         (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));

      const canvas = $('map');
      const ctx = canvas.getContext('2d');

      // World space: map_x/map_y are in [0,1]; spread them over WORLD units so
      // thumbnails (drawn ~TILE world units wide) have breathing room.
      const WORLD = 4200;
      const TILE = 78;

      let points = [];            // {id,x,y,cluster,title,artist,...,img,ready}
      let clusters = [];
      let view = { x: WORLD / 2, y: WORLD / 2, scale: 0.28 }; // world point at canvas centre + zoom
      let hovered = null;
      let dirty = true;
      let mode = 'sim';           // sim | time | origin | theme
      let labels = [];            // world-space captions: {x,y,text,size,lineY0?,lineY1?}
      let tileScale = 1;          // shrinks tiles when a grouped layout overflows the world
      let defaultSubtitle = '';

      const clusterColor = (c) => `hsl(${(c * 137.5) % 360} 70% 55%)`;
      const thumbURL = (p) => `assets/library/${p.id}.jpg`;
      const proxyURL = (p) => `${API_BASE}/api/library/img/${p.id}?size=thumb`;

      // ---------- canvas sizing ----------
      function resize() {
         const dpr = window.devicePixelRatio || 1;
         const r = canvas.getBoundingClientRect();
         canvas.width = r.width * dpr;
         canvas.height = r.height * dpr;
         ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
         dirty = true;
      }
      window.addEventListener('resize', resize);

      const toScreen = (wx, wy) => {
         const r = canvas.getBoundingClientRect();
         return [(wx - view.x) * view.scale + r.width / 2, (wy - view.y) * view.scale + r.height / 2];
      };
      const toWorld = (sx, sy) => {
         const r = canvas.getBoundingClientRect();
         return [(sx - r.width / 2) / view.scale + view.x, (sy - r.height / 2) / view.scale + view.y];
      };

      // ---------- progressive thumbnail loading ----------
      let loadQueue = [], loading = 0, loaded = 0;
      function pumpLoads() {
         while (loading < 12 && loadQueue.length) {
            const p = loadQueue.shift();
            loading++;
            const img = new Image();
            img.onload = () => { p.img = img; p.ready = true; loading--; loaded++; noteProgress(); dirty = true; pumpLoads(); };
            img.onerror = () => {
               if (!p.triedProxy) { p.triedProxy = true; img.src = proxyURL(p); }
               else { loading--; loaded++; noteProgress(); pumpLoads(); }
            };
            img.src = thumbURL(p);
         }
      }
      function noteProgress() {
         $('loadNote').textContent =
            loaded < points.length ? `Loading thumbnails ${loaded}/${points.length}…` : '';
      }

      // ---------- alternate layouts (Timeline / Origin / Theme) ----------
      // Rough west-to-east ordering so the Origin view reads like a map strip.
      const ORIGIN_ORDER = ['American', 'British', 'Irish', 'French', 'Belgian',
         'Dutch', 'Netherlandish', 'Flemish', 'German', 'Swiss', 'Austrian',
         'Italian', 'Spanish', 'Czech', 'Polish', 'Hungarian', 'Swedish',
         'Russian', 'Chinese', 'Japanese'];

      // Lay one group's tiles out as a compact grid (offsets stored on _gx/_gy),
      // ordered by similarity cluster so lookalikes stay adjacent inside it.
      function gridPlace(pts, cell) {
         const cols = Math.max(1, Math.ceil(Math.sqrt(pts.length * 1.6)));
         const sorted = [...pts].sort((a, b) =>
            (a.cluster - b.cluster) || (a.map_x - b.map_x) || (a.map_y - b.map_y));
         sorted.forEach((p, i) => {
            p._gx = (i % cols + 0.5) * cell;
            p._gy = (Math.floor(i / cols) + 0.5) * cell;
         });
         return { w: cols * cell, h: Math.ceil(pts.length / cols) * cell };
      }

      // Pack labelled group grids into centred rows across the world square.
      function groupedLayout(groups, cell) {
         const GAP = cell * 1.4, LABEL_H = 150;
         const rows = [[]];
         let curW = 0;
         for (const g of groups) {
            const dim = gridPlace(g.pts, cell);
            g.w = dim.w; g.h = dim.h + LABEL_H;
            if (curW + g.w > WORLD && rows[rows.length - 1].length) { rows.push([]); curW = 0; }
            rows[rows.length - 1].push(g); curW += g.w + GAP;
         }
         let y = 0;
         for (const row of rows) {
            const rowW = row.reduce((s, g) => s + g.w, 0) + GAP * (row.length - 1);
            let x = (WORLD - rowW) / 2;
            for (const g of row) {
               labels.push({ x: x + g.w / 2, y: y + 70, text: `${g.label} (${g.pts.length})`, size: 60 });
               for (const p of g.pts) { p.tx = x + p._gx; p.ty = y + LABEL_H + p._gy; }
               x += g.w + GAP;
            }
            y += Math.max(...row.map((g) => g.h)) + GAP * 1.6;
         }
      }

      // Compute target positions (tx/ty), visibility, and captions for a mode.
      // Returns a subtitle note ('' → keep the default).
      function computeLayout(m) {
         labels = []; tileScale = 1;
         const cell = TILE * 1.18;
         points.forEach((p) => { p.vis = true; p.tx = p.wx; p.ty = p.wy; });
         let note = '';

         if (m === 'sim') {
            points.forEach((p) => { p.tx = p.map_x * WORLD; p.ty = p.map_y * WORLD; });
         } else if (m === 'time') {
            const dated = points.filter((p) => p.year_start);
            points.forEach((p) => { p.vis = !!p.year_start; });
            const ys = dated.map((p) => p.year_start);
            const y0 = Math.min(...ys), y1 = Math.max(...ys);
            dated.forEach((p) => {
               p.tx = ((p.year_start - y0) / Math.max(1, y1 - y0)) * WORLD;
               p.ty = p.map_y * WORLD;   // similar works stay vertically grouped
            });
            for (let c = Math.ceil(y0 / 100) * 100; c <= y1; c += 100) {
               const x = ((c - y0) / Math.max(1, y1 - y0)) * WORLD;
               labels.push({ x, y: -130, text: String(c), size: 64, lineY0: -70, lineY1: WORLD });
            }
            note = `Timeline: ${dated.length} dated works (${y0}–${y1}) · ${points.length - dated.length} undated hidden.`;
         } else if (m === 'origin') {
            const known = points.filter((p) => (p.nationality || '').trim());
            points.forEach((p) => { p.vis = !!(p.nationality || '').trim(); });
            const byNat = new Map();
            known.forEach((p) => {
               const k = p.nationality.trim();
               if (!byNat.has(k)) byNat.set(k, []);
               byNat.get(k).push(p);
            });
            const groups = [...byNat.entries()]
               .sort((a, b) => {
                  const ia = ORIGIN_ORDER.indexOf(a[0]), ib = ORIGIN_ORDER.indexOf(b[0]);
                  return (ia < 0 ? 99 : ia) - (ib < 0 ? 99 : ib);
               })
               .map(([label, pts]) => ({ label, pts }));
            groupedLayout(groups, cell);
            note = `Origin: ${known.length} works with a known nationality · ${points.length - known.length} unknown hidden.`;
         } else {  // theme
            const byG = new Map();
            points.forEach((p) => {
               const k = (p.genre || 'Other').trim() || 'Other';
               if (!byG.has(k)) byG.set(k, []);
               byG.get(k).push(p);
            });
            const groups = [...byG.entries()]
               .sort((a, b) => b[1].length - a[1].length)
               .map(([label, pts]) => ({ label, pts }));
            const oi = groups.findIndex((g) => g.label === 'Other');
            if (oi >= 0) groups.push(groups.splice(oi, 1)[0]);   // Other last
            groupedLayout(groups, cell);
            note = `Theme: ${points.length} works in ${groups.length} groups.`;
         }

         // Uniform-scale + centre the layout (and captions) into the world square.
         const vis = points.filter((p) => p.vis);
         const xs = vis.map((p) => p.tx).concat(labels.map((L) => L.x));
         const ys2 = vis.map((p) => p.ty).concat(labels.map((L) => L.y));
         const minX = Math.min(...xs), maxX = Math.max(...xs);
         const minY = Math.min(...ys2), maxY = Math.max(...ys2);
         const f = Math.min(1,
            (WORLD * 0.96) / Math.max(1, maxX - minX),
            (WORLD * 0.96) / Math.max(1, maxY - minY));
         tileScale = f;
         const ox = (WORLD - (maxX - minX) * f) / 2, oy = (WORLD - (maxY - minY) * f) / 2;
         const fx = (v) => (v - minX) * f + ox, fy = (v) => (v - minY) * f + oy;
         vis.forEach((p) => { p.tx = fx(p.tx); p.ty = fy(p.ty); });
         labels.forEach((L) => {
            L.x = fx(L.x); L.y = fy(L.y); L.size *= f;
            if (L.lineY0 !== undefined) { L.lineY0 = fy(L.lineY0); L.lineY1 = fy(L.lineY1); }
         });
         return note;
      }

      // Animate every tile from its current position to its target (PixPlot-style morph).
      let morph = null;
      function animateToTargets() {
         const from = points.map((p) => [p.wx, p.wy]);
         const t0 = performance.now(), dur = 700;
         cancelAnimationFrame(morph);
         const step = (t) => {
            const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
            points.forEach((p, i) => {
               p.wx = from[i][0] + (p.tx - from[i][0]) * e;
               p.wy = from[i][1] + (p.ty - from[i][1]) * e;
            });
            dirty = true;
            if (k < 1) morph = requestAnimationFrame(step);
         };
         morph = requestAnimationFrame(step);
      }

      function setMode(m) {
         mode = m;
         const note = computeLayout(m);
         [...$('modes').querySelectorAll('button')].forEach((b) => {
            const on = b.dataset.mode === m;
            b.classList.toggle('bg-neutral-700', on);
            b.classList.toggle('text-white', on);
            b.classList.toggle('text-neutral-400', !on);
         });
         $('hotspots').style.display = m === 'sim' ? '' : 'none';
         $('subtitle').textContent = note || defaultSubtitle;
         setHover(null);
         animateToTargets();
         fitAll(true);
      }
      [...$('modes').querySelectorAll('button')].forEach((b) => {
         b.onclick = () => { if (b.dataset.mode !== mode) setMode(b.dataset.mode); };
      });

      // ---------- drawing ----------
      function draw() {
         requestAnimationFrame(draw);
         if (!dirty) return;
         dirty = false;
         const r = canvas.getBoundingClientRect();
         ctx.clearRect(0, 0, r.width, r.height);

         const size = TILE * tileScale * view.scale;
         for (const p of points) {
            if (!p.vis) continue;
            const [sx, sy] = toScreen(p.wx, p.wy);
            if (sx < -size || sy < -size || sx > r.width + size || sy > r.height + size) continue;
            let w = size, h = size;
            if (p.ready) {
               const a = p.img.naturalWidth / p.img.naturalHeight;
               if (a > 1) h = size / a; else w = size * a;
            }
            const x = sx - w / 2, y = sy - h / 2;
            if (p.ready) {
               ctx.drawImage(p.img, x, y, w, h);
            } else {
               ctx.fillStyle = 'rgba(64,64,64,.35)';
               ctx.fillRect(x, y, w, h);
            }
            if (view.scale < 0.16 || p === hovered) {
               ctx.strokeStyle = clusterColor(p.cluster);
               ctx.lineWidth = p === hovered ? 2.5 : 1;
               ctx.strokeRect(x, y, w, h);
            }
         }

         // Mode captions: group names (Origin/Theme) and century ticks (Timeline).
         ctx.textAlign = 'center';
         for (const L of labels) {
            const [lx, ly] = toScreen(L.x, L.y);
            if (L.lineY0 !== undefined) {
               const ly0 = toScreen(L.x, L.lineY0)[1], ly1 = toScreen(L.x, L.lineY1)[1];
               ctx.strokeStyle = 'rgba(115,115,115,.18)';
               ctx.lineWidth = 1;
               ctx.beginPath(); ctx.moveTo(lx, ly0); ctx.lineTo(lx, ly1); ctx.stroke();
            }
            const px = Math.min(30, L.size * view.scale);
            if (px < 7) continue;
            ctx.fillStyle = 'rgba(212,212,212,.85)';
            ctx.font = `600 ${px}px Inter, sans-serif`;
            ctx.fillText(L.text, lx, ly);
         }
      }

      // ---------- interaction ----------
      let drag = null;
      canvas.addEventListener('pointerdown', (e) => {
         canvas.setPointerCapture(e.pointerId);
         drag = { sx: e.clientX, sy: e.clientY, vx: view.x, vy: view.y, moved: false };
         canvas.classList.add('dragging');
      });
      canvas.addEventListener('pointermove', (e) => {
         const rect = canvas.getBoundingClientRect();
         const mx = e.clientX - rect.left, my = e.clientY - rect.top;
         if (drag) {
            const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
            if (Math.abs(dx) + Math.abs(dy) > 4) drag.moved = true;
            view.x = drag.vx - dx / view.scale;
            view.y = drag.vy - dy / view.scale;
            dirty = true;
            return;
         }
         hover(mx, my, e.clientX, e.clientY);
      });
      canvas.addEventListener('pointerup', (e) => {
         canvas.classList.remove('dragging');
         const wasClick = drag && !drag.moved;
         drag = null;
         if (wasClick && hovered) openLightbox(hovered);
      });
      canvas.addEventListener('pointerleave', () => { setHover(null); });
      canvas.addEventListener('wheel', (e) => {
         e.preventDefault();
         const rect = canvas.getBoundingClientRect();
         const [wx, wy] = toWorld(e.clientX - rect.left, e.clientY - rect.top);
         const factor = Math.exp(-e.deltaY * 0.0012);
         view.scale = Math.min(6, Math.max(0.05, view.scale * factor));
         // keep the world point under the cursor fixed
         const [nsx, nsy] = toScreen(wx, wy);
         view.x += (nsx - (e.clientX - rect.left)) / view.scale;
         view.y += (nsy - (e.clientY - rect.top)) / view.scale;
         dirty = true;
      }, { passive: false });

      function hover(mx, my, clientX, clientY) {
         const size = TILE * tileScale * view.scale;
         let hit = null;
         for (let i = points.length - 1; i >= 0; i--) {   // topmost drawn wins
            const p = points[i];
            if (!p.vis) continue;
            const [sx, sy] = toScreen(p.wx, p.wy);
            if (Math.abs(mx - sx) <= size / 2 && Math.abs(my - sy) <= size / 2) { hit = p; break; }
         }
         setHover(hit, clientX, clientY);
      }
      function setHover(p, clientX, clientY) {
         if (hovered !== p) { hovered = p; dirty = true; }
         const tt = $('tooltip');
         if (!p) { tt.classList.add('hidden'); tt.style.opacity = 0; return; }
         $('ttTitle').textContent = p.title || 'Untitled';
         $('ttMeta').textContent = [p.artist, p.date_text || p.era].filter(Boolean).join(' · ');
         tt.classList.remove('hidden');
         tt.style.opacity = 1;
         const host = canvas.getBoundingClientRect();
         tt.style.left = Math.min(clientX - host.left + 14, host.width - 270) + 'px';
         tt.style.top = (clientY - host.top + 14) + 'px';
      }

      // ---------- fit / fly-to ----------
      function fitAll(animate) {
         if (!points.length) return;
         flyTo(WORLD / 2, WORLD / 2, fitScale(), animate);
      }
      function fitScale() {
         const r = canvas.getBoundingClientRect();
         return Math.min(r.width, r.height) / (WORLD * 1.12);
      }
      let flight = null;
      function flyTo(x, y, scale, animate = true) {
         if (!animate) { view = { x, y, scale }; dirty = true; return; }
         const from = { ...view }, t0 = performance.now(), dur = 550;
         cancelAnimationFrame(flight);
         const step = (t) => {
            const k = Math.min(1, (t - t0) / dur), e = 1 - Math.pow(1 - k, 3);
            view.x = from.x + (x - from.x) * e;
            view.y = from.y + (y - from.y) * e;
            view.scale = from.scale + (scale - from.scale) * e;
            dirty = true;
            if (k < 1) flight = requestAnimationFrame(step);
         };
         flight = requestAnimationFrame(step);
      }
      $('resetView').onclick = () => fitAll(true);

      // ---------- hotspots (cluster chips) ----------
      function buildHotspots() {
         const byCluster = new Map();
         for (const p of points) {
            if (!byCluster.has(p.cluster)) byCluster.set(p.cluster, []);
            byCluster.get(p.cluster).push(p);
         }
         const chips = [...byCluster.entries()].sort((a, b) => b[1].length - a[1].length)
            .map(([c, pts]) => {
               const cx = pts.reduce((s, p) => s + p.wx, 0) / pts.length;
               const cy = pts.reduce((s, p) => s + p.wy, 0) / pts.length;
               return { c, n: pts.length, cx, cy };
            });
         $('hotspots').innerHTML = chips.map((h, i) => `
            <button data-i="${i}" title="${h.n} artworks"
               class="text-[11px] px-2.5 py-1.5 rounded-lg bg-neutral-900 hover:bg-neutral-800 border border-neutral-800 flex items-center gap-1.5">
               <span class="w-2 h-2 rounded-full" style="background:${clusterColor(h.c)}"></span>${h.n}
            </button>`).join('');
         [...$('hotspots').querySelectorAll('button')].forEach((b) => {
            b.onclick = () => { const h = chips[+b.dataset.i]; flyTo(h.cx, h.cy, Math.max(view.scale, 0.9)); };
         });
      }

      // ---------- lightbox ----------
      let currentArt = null;
      function openLightbox(a) {
         currentArt = a;
         $('lbImg').src = `${API_BASE}/api/library/img/${a.id}?size=full`;
         $('lbTitle').textContent = a.title || 'Untitled';
         $('lbMeta').textContent =
            [a.artist, a.nationality, a.date_text || a.era, a.genre, a.medium].filter(Boolean).join(' · ');
         const src = $('lbSource');
         if (a.source_url) { src.href = a.source_url; src.style.display = ''; }
         else { src.style.display = 'none'; }
         $('lightbox').classList.remove('hidden');
         $('lightbox').classList.add('flex');
      }
      function closeLightbox() {
         $('lightbox').classList.add('hidden');
         $('lightbox').classList.remove('flex');
         $('lbImg').src = '';
      }
      $('lbClose').onclick = closeLightbox;
      $('lightbox').onclick = (e) => { if (e.target === $('lightbox')) closeLightbox(); };
      document.addEventListener('keydown', (e) => { if (e.key === 'Escape') closeLightbox(); });
      $('lbUse').onclick = () => {
         if (!currentArt) return;
         localStorage.setItem('gm_pending_library_image', JSON.stringify({
            id: currentArt.id,
            title: currentArt.title,
            url: `${API_BASE}/api/library/img/${currentArt.id}?size=full`,
         }));
         location.href = 'dashboard.html' + (location.search || '');
      };

      // ---------- boot ----------
      async function boot() {
         resize();
         let data;
         try {
            const res = await fetch(API_BASE + '/api/library/map');
            if (!res.ok) throw new Error('HTTP ' + res.status);
            data = await res.json();
         } catch (e) {
            $('empty').classList.remove('hidden');
            $('empty').classList.add('flex');
            $('empty').querySelector('p').textContent = `Couldn't reach the library API (${e.message}).`;
            return;
         }
         if (!data.count) {
            $('empty').classList.remove('hidden');
            $('empty').classList.add('flex');
            return;
         }
         points = data.points.map((p) => ({
            ...p,
            wx: p.map_x * WORLD,
            wy: p.map_y * WORLD,
            tx: p.map_x * WORLD,
            ty: p.map_y * WORLD,
            cluster: p.map_cluster ?? 0,
            vis: true,
            ready: false,
         }));
         clusters = data.clusters || [];
         defaultSubtitle =
            `${data.count} artworks · visually similar works sit close together — drag to pan, scroll to zoom.`;
         $('subtitle').textContent = defaultSubtitle;
         buildHotspots();
         fitAll(false);
         loadQueue = [...points];
         pumpLoads();
         noteProgress();
         draw();
      }
      boot();
   </script>
</body>

</html>
